name: בדיקת שיעורי בית

on:
  schedule:
    # כל 5 דקות בין 7:00 ל-23:55 (שעון ישראל בחורף, UTC+2). GitHub לא תמיד מדייק
    - cron: "*/5 5-21 * * *"
  workflow_dispatch:
    inputs:
      redo:
        description: "לפתור מחדש את X שיעורי הבית האחרונים (0 = בדיקה רגילה)"
        default: "0"
      test:
        description: "בדיקה: לפתור את X האחרונים ולהציג ביומן בלבד, בלי לשנות את האתר (0 = לא)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: homework
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      MASHOV_SCHOOL: ${{ secrets.MASHOV_SCHOOL }}
      MASHOV_USER: ${{ secrets.MASHOV_USER }}
      MASHOV_PASS: ${{ secrets.MASHOV_PASS }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'groq' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      REDO: ${{ github.event.inputs.redo || '0' }}
      TEST: ${{ github.event.inputs.test || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests pypdf

      - name: בדיקה במשו"ב
        id: fetch
        run: |
          if [ "$TEST" != "0" ]; then python engine.py test "$TEST"; echo "new=0" >> "$GITHUB_OUTPUT"
          elif [ "$REDO" != "0" ]; then echo "new=$REDO" >> "$GITHUB_OUTPUT"; else python engine.py fetch; fi

      # הדפדפן (לצילום הדף) מותקן רק כשיש שיעור בית חדש, כדי לחסוך זמן
      - name: התקנת דפדפן וגופן עברי
        if: steps.fetch.outputs.new != '0'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: פתרון ושמירה לאתר
        if: steps.fetch.outputs.new != '0'
        run: |
          if [ "$REDO" != "0" ]; then python engine.py redo "$REDO"; else python engine.py process; fi

      - name: שמירה ועדכון האתר
        run: |
          git config user.name "homework-bot"
          git config user.email "homework-bot@users.noreply.github.com"
          git add seen.json docs
          git diff --cached --quiet || (git commit -m "homework update" && git pull --rebase -q && git push)
