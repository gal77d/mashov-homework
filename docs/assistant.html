<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>עוזר שיעורי בית</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="עוזר">
<meta name="theme-color" content="#1f4fa3">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#1d1d1f;--mute:#6b6860;--line:#ece9e1;--soft:#f7f6f2;--accent:#1f4fa3;--me:#1f4fa3;--meInk:#fff;--ok:#137a3e;--rec:#e5484d}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#1f1f1f;--ink:#f1f0ec;--mute:#a19e95;--line:#2e2e2e;--soft:#262626;--accent:#7aa7ff;--me:#2c4f8f;--meInk:#fff;--ok:#5fd18f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI","Noto Sans Hebrew",Arial,sans-serif;display:flex;flex-direction:column}
header{background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
header h1{font-size:20px;margin:0;flex:1}
.btn{border:0;border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;font-weight:600;background:var(--accent);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:var(--soft);color:var(--ink)}
.tabs{display:flex;gap:6px;padding:8px 16px 0}
.tab{flex:1;text-align:center;padding:8px;border-radius:10px;background:var(--soft);font-weight:600;font-size:14px;cursor:pointer}
.tab.on{background:var(--accent);color:#fff}
main{flex:1;overflow-y:auto;padding:12px 16px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;margin-bottom:10px;white-space:pre-wrap;unicode-bidi:plaintext;line-height:1.45;font-size:16px}
.msg.me{background:var(--me);color:var(--meInk);margin-inline-start:auto;border-end-start-radius:4px}
.msg.ai{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.08);border-end-end-radius:4px}
.msg.sys{background:none;color:var(--mute);font-size:13px;text-align:center;max-width:100%}
.saved{display:block;margin-top:6px;font-size:13px;color:var(--ok);font-weight:600}
.empty{color:var(--mute);text-align:center;padding:30px 10px;line-height:1.6}
.task{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.task h3{margin:0 0 4px;font-size:17px;color:var(--accent);unicode-bidi:plaintext}
.task .meta{color:var(--mute);font-size:12px;margin-bottom:6px}
.task .det{background:var(--soft);border-radius:8px;padding:8px 10px;font-size:14px;white-space:pre-wrap;unicode-bidi:plaintext}
.task .ans{margin-top:8px;white-space:pre-wrap;unicode-bidi:plaintext;font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
footer{padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);border-top:1px solid var(--line);background:var(--bg);display:flex;gap:8px;align-items:center}
footer textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;font-size:16px;background:var(--card);color:var(--ink);max-height:120px}
.mic{width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#fff;flex:none;display:grid;place-items:center;cursor:pointer}
.mic.rec{background:var(--rec);animation:pulse 1.2s infinite}
.mic.busy{opacity:.5}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,72,77,.5)}70%{box-shadow:0 0 0 14px rgba(229,72,77,0)}100%{box-shadow:0 0 0 0 rgba(229,72,77,0)}}
.send{width:44px;height:44px;border-radius:50%;padding:0;flex:none;display:grid;place-items:center}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20;align-items:flex-end}
.sheet.show{display:flex}
.panel{background:var(--card);width:100%;border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:85vh;overflow:auto}
.panel h2{margin:0 0 10px;font-size:19px}
.panel label{display:block;font-weight:600;margin:12px 0 4px;font-size:14px}
.panel input[type=password],.panel input[type=text]{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);font:inherit;font-size:16px;background:var(--soft);color:var(--ink);direction:ltr}
.hint{color:var(--mute);font-size:13px;line-height:1.5;margin-top:4px}
.check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:15px}
#chips{padding:0 16px;display:flex;flex-wrap:wrap;gap:6px}
#chips:empty{display:none}
#chips{padding-top:8px;border-top:1px solid var(--line)}
.chip{background:var(--soft);border-radius:99px;padding:5px 10px;font-size:13px;display:flex;gap:6px;align-items:center;max-width:100%}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{border:0;background:none;color:var(--mute);font-size:16px;cursor:pointer;padding:0}
.file{display:block;margin-top:5px;font-size:12px;opacity:.85}
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <a class="btn ghost" href="./">שיעורי בית</a>
  <h1>עוזר</h1>
  <button class="btn ghost" id="openSettings">הגדרות</button>
</header>
<div class="tabs">
  <div class="tab on" data-tab="chat">שיחה</div>
  <div class="tab" data-tab="tasks">המשימות שלי <span id="taskCount"></span></div>
</div>
<main id="chat"></main>
<main id="tasks" hidden></main>
<div id="chips"></div>
<footer id="bar">
  <button class="btn ghost send" id="attach" aria-label="צרף קובץ">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"/></svg>
  </button>
  <input type="file" id="file" accept=".pdf,.docx,.txt,image/*" hidden>
  <textarea id="text" rows="1" placeholder="כתוב, הדבק קישור, או לחץ על המיקרופון"></textarea>
  <button class="btn send" id="send" aria-label="שלח">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 5l-7 7 7 7"/></svg>
  </button>
  <button class="mic" id="mic" aria-label="דבר">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
  </button>
</footer>

<div class="sheet" id="settings">
  <div class="panel">
    <h2>הגדרות</h2>
    <label for="key">מפתח Groq</label>
    <input type="password" id="key" placeholder="gsk_..." autocomplete="off">
    <div class="hint">המפתח נשמר רק בטלפון הזה, ולא נשלח לשום מקום חוץ מ-Groq. משיגים אותו ב-console.groq.com, בתפריט API Keys.</div>
    <label class="check"><input type="checkbox" id="voiceOn"> העוזר עונה בקול</label>
    <div class="row">
      <button class="btn" id="saveSettings">שמור</button>
      <button class="btn ghost" id="clearChat">מחק את השיחה</button>
      <button class="btn ghost" id="closeSettings">סגור</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const GROQ = "https://api.groq.com/openai/v1";
const MODEL = "openai/gpt-oss-120b";

function load(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

let history = load("aiHistory", []);   // [{role, content}]
let tasks = load("aiTasks", []);       // [{id, title, subject, due, details, answer, added}]
let settings = load("aiSettings", { key: "", voice: true });
let homework = [];

function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); setTimeout(() => el.classList.remove("show"), 1800); }

// ---------- רשימת שיעורי הבית מהאתר (כדי שהעוזר יכיר אותם)
fetch("data/homework.json?t=" + Date.now(), { cache: "no-store" })
  .then(r => r.ok ? r.json() : []).then(d => homework = d).catch(() => {});

// ---------- תצוגה
function renderChat() {
  const box = $("#chat");
  if (!history.length) {
    box.innerHTML = `<div class="empty">לחץ על המיקרופון ודבר, או כתוב.<br>אפשר לשאול על שיעורי הבית, לבקש הסבר,<br>או לספר "יש לי משימה..." והעוזר יפתור וישמור אותה.</div>`;
  } else {
    box.innerHTML = history.map(m => {
      if (m.role === "user") return `<div class="msg me">${esc(m.show ?? m.content)}${(m.files || []).map(f => `<span class="file">קובץ מצורף: ${esc(f)}</span>`).join("")}</div>`;
      let j; try { j = JSON.parse(m.content); } catch (e) { j = { reply: m.content }; }
      return `<div class="msg ai">${esc(j.reply)}${j.task ? `<span class="saved">נשמר במשימות שלי: ${esc(j.task.title)}</span>` : ""}</div>`;
    }).join("");
  }
  box.scrollTop = box.scrollHeight;
}
function sys(t) { const d = document.createElement("div"); d.className = "msg sys"; d.textContent = t; $("#chat").appendChild(d); $("#chat").scrollTop = 1e9; return d; }

function renderTasks() {
  $("#taskCount").textContent = tasks.length ? `(${tasks.length})` : "";
  const box = $("#tasks");
  if (!tasks.length) { box.innerHTML = `<div class="empty">אין עדיין משימות.<br>ספר לעוזר "יש לי משימה ב..." והוא יפתור וישמור אותה כאן.</div>`; return; }
  box.innerHTML = tasks.map(t => `<div class="task" data-id="${t.id}">
    <h3>${esc(t.title)}</h3>
    <div class="meta">${esc([t.subject, t.due ? "להגשה: " + t.due : ""].filter(Boolean).join(" · "))}</div>
    ${t.details ? `<div class="det">${esc(t.details)}</div>` : ""}
    <div class="ans">${esc(t.answer)}</div>
    <div class="row"><button class="btn" data-act="copy">העתק תשובה</button><button class="btn ghost" data-act="say">הקרא</button><button class="btn ghost" data-act="del">מחק</button></div>
  </div>`).join("");
}
$("#tasks").addEventListener("click", e => {
  const card = e.target.closest(".task"); if (!card) return;
  const t = tasks.find(x => x.id === card.dataset.id); const act = e.target.dataset.act;
  if (act === "copy") copy(t.answer);
  if (act === "say") speak(t.answer);
  if (act === "del" && confirm("למחוק את המשימה?")) { tasks = tasks.filter(x => x !== t); save("aiTasks", tasks); renderTasks(); }
});
async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const a = document.createElement("textarea"); a.value = text; document.body.appendChild(a); a.select(); document.execCommand("copy"); a.remove(); }
  toast("הועתק");
}

document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
  const chat = t.dataset.tab === "chat";
  $("#chat").hidden = !chat; $("#tasks").hidden = chat; $("#bar").style.display = chat ? "" : "none";
});

// ---------- הגדרות
function openSettings() { $("#key").value = settings.key; $("#voiceOn").checked = settings.voice; $("#settings").classList.add("show"); }
$("#openSettings").onclick = openSettings;
$("#closeSettings").onclick = () => $("#settings").classList.remove("show");
$("#saveSettings").onclick = () => {
  settings = { key: $("#key").value.trim(), voice: $("#voiceOn").checked };
  save("aiSettings", settings); $("#settings").classList.remove("show"); toast("נשמר");
};
$("#clearChat").onclick = () => { if (confirm("למחוק את כל השיחה?")) { history = []; save("aiHistory", history); renderChat(); $("#settings").classList.remove("show"); } };

// ---------- דיבור (הקראה)
let voices = [];
function loadVoices() { voices = speechSynthesis.getVoices(); }
if ("speechSynthesis" in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(text) {
  if (!("speechSynthesis" in window) || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "he-IL";
  const v = voices.find(v => v.lang && v.lang.toLowerCase().startsWith("he"));
  if (v) u.voice = v;
  u.rate = 1.05;
  speechSynthesis.speak(u);
}
function unlockSpeech() { // באייפון צריך "לפתוח" את הקול בלחיצה הראשונה
  if ("speechSynthesis" in window && !unlockSpeech.done) { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); unlockSpeech.done = true; }
}

// ---------- ה-AI
function systemPrompt() {
  const today = new Date().toLocaleDateString("he-IL", { weekday: "long", day: "numeric", month: "numeric", year: "numeric" });
  const hw = homework.slice(0, 10).map(h => `- ${h.subject} (${h.date}): ${String(h.text).slice(0, 300)}${h.title ? " | " + h.title : ""}`).join("\n") || "(אין)";
  const my = tasks.slice(0, 15).map(t => `- ${t.title}${t.subject ? " (" + t.subject + ")" : ""}${t.due ? ", להגשה " + t.due : ""}`).join("\n") || "(אין)";
  return `אתה עוזר אישי חכם וחביב לתלמיד בישראל. מדברים איתך בקול, ולכן התשובה שלך מוקראת בקול.
היום: ${today}.

שיעורי הבית האחרונים ממשו"ב:
${hw}

המשימות שהתלמיד שמר אצלך:
${my}

כללים:
- ענה בעברית פשוטה וברורה.
- השדה "reply" מוקרא בקול, לכן הוא קצר: 1 עד 4 משפטים, בלי רשימות ארוכות, בלי סימנים מיוחדים ובלי LaTeX.
- כשהתלמיד מספר על משימה (למשל "יש לי משימה בהיסטוריה..."), פתור אותה במלואה ושמור אותה בשדה "task".
  ב-reply תגיד בקצרה ששמרת ומה עיקר התשובה. את הפתרון המלא כתוב ב-task.answer.
- אם בשאלה יש בחירה ("בחרו", "לבחירתכם", "דוגמה משלכם"): בחר בעצמך אפשרות מתאימה וענה עד הסוף. אל תכתוב "תלוי בבחירתכם".
- אל תמציא עובדות. אם אתה לא מכיר ספר, שיר או סיפור מסוים, אמור זאת בכנות ובקש מהתלמיד לספר מה כתוב בו.
- אם בהודעה יש "תוכן הקובץ" או "תוכן מהקישור", זה הטקסט האמיתי של המשימה: ענה לפיו, ואל תגיד שאינך יכול לפתוח קבצים.
- אם חסר פרט כדי לפתור (למשל מה בדיוק השאלה), שאל שאלה אחת קצרה.

החזר JSON בלבד:
{"reply": "מה שמוקרא בקול", "task": null}
או, כשיש משימה לשמור:
{"reply": "...", "task": {"title": "כותרת קצרה", "subject": "מקצוע או ריק", "due": "תאריך הגשה או ריק", "details": "מה המשימה", "answer": "הפתרון המלא, מוכן להגשה"}}`;
}

// ---------- קבצים וקישורים
const LIMIT = 8000;
let attached = []; // [{name, text}]
function loadScript(src) {
  return new Promise((ok, bad) => { if (document.querySelector(`script[src="${src}"]`)) return ok(); const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => bad(new Error("לא נטען " + src)); document.head.appendChild(s); });
}
async function pdfText(buf) {
  const base = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  await loadScript(base + "pdf.min.js");
  pdfjsLib.GlobalWorkerOptions.workerSrc = base + "pdf.worker.min.js";
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let out = "";
  for (let i = 1; i <= Math.min(pdf.numPages, 15); i++) {
    const c = await (await pdf.getPage(i)).getTextContent();
    out += c.items.map(x => x.str).join(" ") + "\n";
  }
  return out;
}
async function docxText(buf) {
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js");
  return (await mammoth.extractRawText({ arrayBuffer: buf })).value;
}
async function imageText(file) { // תמונה -> טקסט בעזרת מודל ראייה של Groq
  const url = await new Promise((ok, bad) => {
    const img = new Image(); const r = new FileReader();
    r.onload = () => { img.src = r.result; }; r.onerror = bad;
    img.onload = () => { const k = Math.min(1, 1400 / Math.max(img.width, img.height)); const c = document.createElement("canvas");
      c.width = img.width * k; c.height = img.height * k; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); ok(c.toDataURL("image/jpeg", 0.85)); };
    img.onerror = () => bad(new Error("התמונה לא נפתחה"));
    r.readAsDataURL(file);
  });
  const r = await fetch(GROQ + "/chat/completions", {
    method: "POST", headers: { "Authorization": "Bearer " + settings.key, "Content-Type": "application/json" },
    body: JSON.stringify({ model: "meta-llama/llama-4-scout-17b-16e-instruct", temperature: 0, messages: [{ role: "user", content: [
      { type: "text", text: "העתק את כל הטקסט שמופיע בתמונה, כולל שאלות, מספרים ונוסחאות, בדיוק כפי שהוא. אם יש ציור או גרף, תאר אותו במשפט. החזר רק את הטקסט." },
      { type: "image_url", image_url: { url } }] }] }),
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error?.message || ("שגיאה " + r.status));
  return d.choices[0].message.content;
}
async function fileText(file) {
  const n = file.name.toLowerCase();
  if (file.type.startsWith("image/")) return imageText(file);
  const buf = await file.arrayBuffer();
  if (n.endsWith(".pdf") || file.type === "application/pdf") return pdfText(buf);
  if (n.endsWith(".docx")) return docxText(buf);
  return new TextDecoder().decode(buf);
}
function linkUrl(u) { // קישורי גוגל -> הכתובת שמחזירה את התוכן
  let m = u.match(/docs\.google\.com\/(document|presentation|spreadsheets)\/d\/([\w-]+)/);
  if (m) return m[1] === "spreadsheets" ? `https://docs.google.com/spreadsheets/d/${m[2]}/export?format=csv`
    : m[1] === "presentation" ? `https://docs.google.com/presentation/d/${m[2]}/export/txt`
    : `https://docs.google.com/document/d/${m[2]}/export?format=txt`;
  return u;
}
async function linkText(u) {
  const r = await fetch(linkUrl(u));
  if (!r.ok) throw new Error("קוד " + r.status);
  const type = (r.headers.get("content-type") || "").toLowerCase();
  if (type.includes("pdf")) return pdfText(await r.arrayBuffer());
  const t = await r.text();
  if (type.includes("html")) { const doc = new DOMParser().parseFromString(t, "text/html"); doc.querySelectorAll("script,style,noscript").forEach(x => x.remove()); return doc.body.innerText || doc.body.textContent; }
  return t;
}
function renderChips() {
  $("#chips").innerHTML = attached.map((a, i) => `<div class="chip"><span>${esc(a.name)}</span><button data-i="${i}" aria-label="הסר">×</button></div>`).join("");
}
$("#chips").addEventListener("click", e => { const i = e.target.dataset.i; if (i !== undefined) { attached.splice(+i, 1); renderChips(); } });
$("#attach").onclick = () => { if (!settings.key) { openSettings(); toast("צריך להכניס מפתח Groq"); return; } $("#file").click(); };
$("#file").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  const wait = sys("קורא את הקובץ " + f.name + "…");
  try {
    const t = (await fileText(f) || "").replace(/[ \t]+/g, " ").trim();
    wait.remove();
    if (!t) { sys("לא מצאתי טקסט בקובץ " + f.name); return; }
    attached.push({ name: f.name, text: t.slice(0, LIMIT) }); renderChips();
    toast("הקובץ מוכן. עכשיו כתוב או אמור מה לעשות איתו");
  } catch (err) { wait.remove(); sys("לא הצלחתי לקרוא את הקובץ: " + err.message); }
};

async function ask(userText) {
  if (!settings.key) { openSettings(); toast("צריך להכניס מפתח Groq"); return; }
  let full = userText;
  const files = attached.map(a => a.name);
  attached.forEach(a => { full += `\n\n--- תוכן הקובץ ${a.name} ---\n${a.text}`; });
  attached = []; renderChips();
  const urls = [...new Set((userText.match(/https?:\/\/[^\s<>"')\]]+/g) || []).map(u => u.replace(/[.,;:!?]+$/, "")))].slice(0, 2);
  for (const u of urls) {
    const w = sys("פותח את הקישור…");
    try { const t = (await linkText(u) || "").replace(/[ \t]+/g, " ").trim(); w.remove();
      if (t) full += `\n\n--- תוכן מהקישור ${u} ---\n${t.slice(0, LIMIT)}`; else throw new Error("ריק"); }
    catch (e) { w.remove(); full += `\n\n(לא הצלחתי לפתוח את הקישור ${u})`;
      sys("לא הצלחתי לפתוח את הקישור. אם זה קובץ, הורד אותו וצרף אותו בכפתור האטב. אם זה מסמך גוגל, צריך שיהיה משותף ל\"כל מי שיש לו את הקישור\"."); }
  }
  history.push({ role: "user", content: full, show: userText || "(קובץ)", files }); save("aiHistory", history); renderChat();
  const wait = sys("חושב…");
  try {
    const msgs = [{ role: "system", content: systemPrompt() }, ...history.slice(-16).map(m => ({ role: m.role, content: m.content }))];
    const r = await fetch(GROQ + "/chat/completions", {
      method: "POST",
      headers: { "Authorization": "Bearer " + settings.key, "Content-Type": "application/json" },
      body: JSON.stringify({ model: MODEL, messages: msgs, temperature: 0.4, response_format: { type: "json_object" } }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error?.message || ("שגיאה " + r.status));
    let j; try { j = JSON.parse(d.choices[0].message.content); } catch (e) { j = { reply: d.choices[0].message.content }; }
    if (j.task && j.task.title) {
      tasks.unshift({ id: String(Date.now()), added: new Date().toISOString(), title: j.task.title, subject: j.task.subject || "", due: j.task.due || "", details: j.task.details || "", answer: j.task.answer || "" });
      save("aiTasks", tasks); renderTasks();
    }
    history.push({ role: "assistant", content: JSON.stringify({ reply: j.reply || "", task: j.task && j.task.title ? { title: j.task.title } : null }) });
    save("aiHistory", history.slice(-60)); history = history.slice(-60);
    renderChat();
    if (settings.voice) speak(j.reply);
  } catch (e) {
    wait.remove(); sys("לא הצלחתי: " + e.message);
    return;
  }
}

// ---------- הקלטה ותמלול (Whisper של Groq)
let rec = null, chunks = [], stream = null;
async function startRec() {
  if (!settings.key) { openSettings(); toast("צריך להכניס מפתח Groq"); return; }
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { toast("אין גישה למיקרופון"); return; }
  const type = ["audio/webm", "audio/mp4", "audio/ogg"].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";
  rec = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
  chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = onStop;
  rec.start();
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  $("#mic").classList.add("rec");
}
function stopRec() { if (rec && rec.state === "recording") rec.stop(); $("#mic").classList.remove("rec"); }
async function onStop() {
  stream.getTracks().forEach(t => t.stop());
  const type = rec.mimeType || "audio/webm";
  const blob = new Blob(chunks, { type });
  if (blob.size < 2000) { toast("ההקלטה קצרה מדי"); return; }
  const ext = type.includes("mp4") ? "m4a" : type.includes("ogg") ? "ogg" : "webm";
  $("#mic").classList.add("busy");
  const wait = sys("מתמלל…");
  try {
    const fd = new FormData();
    fd.append("file", blob, "voice." + ext);
    fd.append("model", "whisper-large-v3-turbo");
    fd.append("language", "he");
    const r = await fetch(GROQ + "/audio/transcriptions", { method: "POST", headers: { "Authorization": "Bearer " + settings.key }, body: fd });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error?.message || ("שגיאה " + r.status));
    wait.remove();
    const text = (d.text || "").trim();
    if (!text) { toast("לא שמעתי כלום"); return; }
    await ask(text);
  } catch (e) { wait.remove(); sys("לא הצלחתי לתמלל: " + e.message); }
  finally { $("#mic").classList.remove("busy"); }
}
$("#mic").onclick = () => { unlockSpeech(); if (rec && rec.state === "recording") stopRec(); else startRec(); };

$("#send").onclick = () => { unlockSpeech(); const t = $("#text").value.trim(); if (!t && !attached.length) return; $("#text").value = ""; ask(t || "פתור את המשימה שבקובץ"); };
$("#text").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#send").click(); } });

renderChat(); renderTasks();
if (!settings.key) setTimeout(openSettings, 300);
</script>
